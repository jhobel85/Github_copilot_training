services:
  product:
    build:
      context: ./services/product_service
    ports:
      - "8001:8001"
    environment:
      API_KEY: local-development-api-key
      DATABASE_URL: sqlite:////data/product_service.db
    volumes:
      - product-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory:
    build:
      context: ./services/inventory_service
    ports:
      - "8002:8002"
    environment:
      API_KEY: local-development-api-key
      DATABASE_URL: sqlite:////data/inventory_service.db
    volumes:
      - inventory-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  order:
    build:
      context: ./services/order_service
    ports:
      - "8003:8003"
    environment:
      API_KEY: local-development-api-key
      PRODUCT_SERVICE_URL: http://product:8001
      INVENTORY_SERVICE_URL: http://inventory:8002
      DATABASE_URL: sqlite:////data/order_service.db
    volumes:
      - order-data:/data
    depends_on:
      product:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  product-data:
  inventory-data:
  order-data:
