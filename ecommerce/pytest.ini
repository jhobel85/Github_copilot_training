[pytest]
# Root-level runs only collect tests/ directly under the repository root. The
# per-service suites each have their own pytest.ini (see services/<name>/) and
# must be run from inside their directory.
testpaths = tests
markers =
    browser: end-to-end tests that drive the Swagger UI in a Playwright Chromium browser (requires: playwright install chromium)
addopts = -m "not browser"
